name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -C internal/db/sqlitetest -count=1 ./...
      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
      - run: ~/go/bin/staticcheck ./...
      - run: go vet ./... && go build ./...
        working-directory: example
      - run: go vet ./... && go build ./...
        working-directory: ui/e2e/stand

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check:js
      - run: npm run test:js

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
