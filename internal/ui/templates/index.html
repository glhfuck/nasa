<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Config Manager</title>
    
    <!-- Global error handlers (console only) -->
    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error(`GLOBAL ERROR: ${msg} at line ${lineNo}:${columnNo}`, error);
            return false;
        };
        window.onunhandledrejection = function(event) {
            console.error(`PROMISE ERROR: ${event.reason}`);
        };
    </script>
    
    <!-- Apply saved theme before first paint (no flash) -->
    <script>
        try {
            var savedTheme = localStorage.getItem('nasa-theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.dataset.theme = 'dark';
            }
        } catch (e) { /* storage unavailable */ }
    </script>
    
    <link rel="stylesheet" href="/ui/static/style.css">
    <link rel="stylesheet" href="/ui/static/highlight.css">
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <button class="btn btn-secondary btn-sm view-fab" id="viewBtn" title="Toggle tree view" aria-label="Toggle tree view"></button>
            <button class="btn btn-secondary btn-sm theme-fab" id="themeBtn" title="Toggle dark theme" aria-label="Toggle dark theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
            <div class="create-widget" id="createWidget">
                <button class="btn btn-secondary btn-sm create-fab" id="createBtn" title="Add new key" aria-label="Add new key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
                <div class="create-tray">
                    <div class="create-clip">
                        <form class="create-form" id="createForm">
                            <input type="text" id="createKey" class="edit-input primitive-editor" placeholder="key/like/this" spellcheck="false" autocomplete="off">
                            <pre id="createValue" class="json-editor edit-input" contenteditable="true" spellcheck="false" data-placeholder='JSON value, e.g. 42 or "text"'></pre>
                            <div class="create-form-actions">
                                <button type="button" class="btn btn-secondary btn-sm" id="cancelCreateBtn">Cancel</button>
                                <button type="submit" class="btn btn-primary btn-sm">Create</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <!-- Outside clicks land here and dismiss the open card. -->
            <div class="create-scrim" id="createScrim" hidden></div>
            <div class="search-box">
                <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>
                <input type="text" id="searchInput" placeholder="Search configs...">
            </div>
        </div>
        
        <div class="config-list" id="configList"></div>
        
        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>
    </div>

    <script src="/ui/static/highlight.js"></script>
    <script type="module">
        import { init } from '/ui/static/js/main.js';
        init();
    </script>
</body>
</html>
